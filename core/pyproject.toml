[project]
name = "donna-core"
version = "0.1.0"
description = "DONNA's Python core: agent, tools, event bus and local WebSocket server."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "websockets>=13,<16",
]

[project.scripts]
donna-core = "donna_core.__main__:main"
donna-cli = "donna_core.cli.client:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/donna_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["donna_core"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
